name: Admin Web CI

on:
  push:
    branches: [main, master]
    paths:
      - 'admin-web/**'
      - '.github/workflows/admin-web-ci.yml'
  pull_request:
    paths:
      - 'admin-web/**'
      - '.github/workflows/admin-web-ci.yml'

jobs:
  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
