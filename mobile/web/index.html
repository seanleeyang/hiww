<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Hiww — buy what you want from travelers heading your way.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FBF7F3">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hiww">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hiww</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #FBF7F3; }
    @media (prefers-color-scheme: dark) { html, body { background: #201B17; } }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1E2422;
    }
    @media (prefers-color-scheme: dark) { #loading { color: #F2EDE7; } }
    #loading .mark { font-size: 34px; font-weight: 800; letter-spacing: -0.5px; }
    #loading .mark span { color: #E1523A; }
    #loading .spinner {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2.5px solid rgba(128,128,128,0.25); border-top-color: #E1523A;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="mark">Hiww<span>.</span></div>
    <div class="spinner"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
