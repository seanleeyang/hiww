# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One web service running the API container. The database is Neon (free), not a
# Render database, so its URL is pasted in as a secret. Migrations run on every
# deploy from the container's start command (idempotent).
services:
  - type: web
    name: hiww-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production

      # Neon → Dashboard → Connection Details → "Pooled connection" string.
      # Must include ?sslmode=require (Neon's default string does).
      - key: DATABASE_URL
        sync: false

      # Render generates a strong value once and keeps it.
      - key: JWT_SECRET
        generateValue: true

      # The public https origin. Set after the first deploy to
      # https://<your-service>.onrender.com (or a custom domain). If left unset
      # the app derives it per-request, which also works behind Render's proxy.
      - key: PUBLIC_BASE_URL
        sync: false

      - key: MANUAL_MONEY_PILOT
        value: "true"

      # Shown to shoppers on the pay screen. Put your bank / Wise / PromptPay
      # details here (keep them out of git).
      - key: PILOT_PAYMENT_INSTRUCTIONS
        sync: false

      - key: PAYMENT_PROVIDER
        value: mock
      - key: IDENTITY_PROVIDER
        value: mock
      - key: LOG_LEVEL
        value: info

      # AI receipt check. Set the key to switch it on; without a key it silently
      # falls back to the mock analyzer.
      - key: AI_RECEIPT_ANALYZER
        value: claude
      - key: AI_MODEL
        value: claude-opus-5
      - key: ANTHROPIC_API_KEY
        sync: false

      # AI chat moderation: flags contact-info / off-platform-payment leakage
      # and abusive messages in order chat. Uses the same ANTHROPIC_API_KEY
      # above, on a cheap text-only model.
      - key: AI_CHAT_MODERATION
        value: claude
      - key: AI_CHAT_MODEL
        value: claude-haiku-4-5

      # Uploaded images -> Cloudflare R2 (Render's free disk is ephemeral).
      # Until all five R2_* values are set the app logs a warning and falls
      # back to local disk. See docs/DEPLOY.md.
      - key: UPLOADS_BACKEND
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
