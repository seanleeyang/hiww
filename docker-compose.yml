version: '3.9'

# Local container run. Secrets come from your shell / a .env file next to this
# compose file — nothing sensitive is committed. Required variables:
#   JWT_SECRET        strong random string
#   POSTGRES_PASSWORD database password
services:
  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/hiww
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      MANUAL_MONEY_PILOT: ${MANUAL_MONEY_PILOT:-true}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      IDENTITY_PROVIDER: ${IDENTITY_PROVIDER:-mock}
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: hiww
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    # Not published to the host by default — uncomment for local DB access.
    # ports:
    #   - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
